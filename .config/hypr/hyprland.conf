##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$


windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
#windowrule = content none, class:mpv 
windowrule = content none, match:class ^mpv$

#for libadwaita gtk4 apps you can use this command:
#exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

#for gtk3 apps you need to install adw-gtk3 theme (in arch linux sudo pacman -S adw-gtk-theme)
#exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"   # for GTK3 apps

#for kde apps you need to install: sudo pacman -S qt5ct qt6ct kvantum kvantum breeze-icons   
#you will need to set dark theme for qt apps from kde more difficult thans with gnome :D:
#env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme

windowrule {
    name = kde-connect-daemon-pointer
    match:initial_class = org\.kde\.kdeconnect\.daemon   # Escaped dots for RE2 regex

	suppress_event = fullscreen maximize togglefullscreen
	#no_focus = on
	no_initial_focus = on
	float = on
    	#pin = on
    	move = 0 0
	size = 1920 1080                 # Shrink tiny to hide any residual flash
    opacity = 1             # Near-invisible (adjust to 0.0 if needed)
	no_dim = on
	#no_shadow = on
    no_blur = on
    border_size = 0
    no_shadow = on
    no_anim = on
}
windowrule = match:title ^(video0 - mpv)$, opaque on
windowrule = match:title ^(video0 - mpv)$, no_dim on
windowrule = match:title ^(video0 - mpv)$, no_blur on
windowrule = match:title ^(video0 - mpv)$, tile off
windowrule = match:title ^(video0 - mpv)$, pin on
windowrule = match:title ^(video0 - mpv)$, keep_aspect_ratio on
windowrule = match:title ^(video0 - mpv)$, move (monitor_w-window_w) (monitor_h-window_h)
windowrule = match:title ^(video0 - mpv)$, size monitor_w*0.3*0.7 monitor_h*0.4*0.7
